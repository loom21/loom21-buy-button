name: Release

# ...attaches dist/ and the script's SRI hash to a GitHub release.
# Publishes via npm trusted publishing (OIDC) — no token needed.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write # npm provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest      # ← add: trusted publishing needs npm 11.5.1+
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: SRI hash
        run: echo "sha384-$(openssl dgst -sha384 -binary dist/buy-button.js | openssl base64 -A)" > dist/buy-button.js.sri
      - run: npm publish --access public --provenance
      - name: GitHub release
        run: |
          (cd dist && zip -r ../buy-button-dist.zip .)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            dist/buy-button.js dist/buy-button.js.map dist/buy-button.js.sri buy-button-dist.zip
        env:
          GH_TOKEN: ${{ github.token }}
